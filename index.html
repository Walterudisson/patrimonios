<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Conferência de Patrimônio CM</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leitor de Código de Barras -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    .accordion-content { transition: max-height 0.3s ease-out; overflow: hidden; }
    .accordion-content.collapsed { max-height: 0 !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold text-blue-400 flex items-center gap-2">📦 Patrimônio CM</h1>
      <div class="flex gap-2">
        <button id="tab-btn-scanner" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white">📷 Leitura</button>
        <button id="tab-btn-lista" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-700 text-slate-300">📋 Relação BD</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4">

    <!-- ABA 1: LEITURA E REGISTRO -->
    <section id="sec-scanner" class="space-y-4">
      
      <!-- Câmera com Leitor -->
      <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 shadow-lg space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-semibold text-slate-400">LEITOR DE CÓDIGO DE BARRAS</span>
          <button id="btn-toggle-cam" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded-lg">Ligar Câmera</button>
        </div>
        
        <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[180px] flex items-center justify-center text-slate-500 text-xs relative">
          Câmera pausada
        </div>

        <button id="btn-capturar-frame" class="hidden w-full bg-slate-700 hover:bg-slate-600 text-blue-400 font-bold py-2 rounded-lg text-xs border border-blue-500/30">
          📸 Capturar e Ler Quadro Atual
        </button>
      </div>

      <!-- Formulário de Busca -->
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
        <div class="relative">
          <label class="text-xs text-slate-400 font-semibold block mb-1">NÚMERO DA PLAQUETA / PATRIMÔNIO</label>
          <div class="flex gap-2">
            <input type="text" id="input-plaqueta" autocomplete="off" placeholder="Digite ou leia a etiqueta..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <button id="btn-buscar" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg text-sm">Buscar</button>
          </div>
          <div id="suggestions-box" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl z-20 max-h-48 overflow-y-auto"></div>
        </div>

        <!-- Detalhes do Item Encontrado -->
        <div id="item-details" class="hidden bg-slate-900/80 p-3 rounded-lg border border-slate-700/80 space-y-2 text-xs">
          <div class="flex justify-between items-start">
            <span id="det-plaqueta" class="font-bold text-blue-400 text-sm">---</span>
            <span id="det-status" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-slate-700 text-slate-300">PENDENTE</span>
          </div>
          <div><strong class="text-slate-400">Descrição:</strong> <span id="det-descricao" class="text-slate-200">---</span></div>
          <div><strong class="text-slate-400">Divisão Original:</strong> <span id="det-divisao" class="text-slate-300">---</span></div>
        </div>

        <!-- Lançamento com Caixa de Seleção/Busca de Divisão -->
        <div class="space-y-2 pt-2 border-t border-slate-700/50">
          <div>
            <label class="text-xs text-slate-400 font-semibold block mb-1">LOCALIZAÇÃO ATUAL DO BEM (DIVISÃO) *</label>
            <select id="select-localizacao" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
              <option value="">-- Selecione a Divisão Atual --</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400 font-semibold block mb-1">OBSERVAÇÕES (OPCIONAL)</label>
            <textarea id="input-observacao" rows="2" placeholder="Ex: Etiqueta desgastada, item em ótimo estado..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
          </div>

          <button id="btn-salvar" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition-colors">
            ✅ Marcar como LOCALIZADO
          </button>
        </div>
      </div>
    </section>

    <!-- ABA 2: LISTA E DIVISÕES -->
    <section id="sec-lista" class="hidden space-y-4">
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-center">
          <div id="cnt-total" class="text-base font-bold text-white">0</div>
          <div class="text-[10px] text-slate-400 font-semibold">TOTAL BD</div>
        </div>
        <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-center">
          <div id="cnt-localizados" class="text-base font-bold text-emerald-400">0</div>
          <div class="text-[10px] text-slate-400 font-semibold">LOCALIZADOS</div>
        </div>
        <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-center">
          <div id="cnt-pendentes" class="text-base font-bold text-amber-400">0</div>
          <div class="text-[10px] text-slate-400 font-semibold">PENDENTES</div>
        </div>
      </div>

      <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
        <div class="flex gap-2">
          <input type="text" id="filtro-busca" placeholder="🔍 Buscar plaqueta..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white">
          <select id="filtro-status" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
            <option value="todos">Todos Status</option>
            <option value="localizados">🟢 Localizados</option>
            <option value="pendentes">🔴 Pendentes</option>
          </select>
        </div>
        <div>
          <select id="filtro-divisao" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white">
            <option value="todas">Todas as Divisões</option>
          </select>
        </div>
      </div>

      <div id="container-accordions" class="space-y-3"></div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVMSES7nwZkZZdQpemDZIb8ypd40bUtvs",
      authDomain: "patrimonioscm.firebaseapp.com",
      projectId: "patrimonioscm",
      storageBucket: "patrimonioscm.firebasestorage.app",
      messagingSenderId: "707665651049",
      appId: "1:707665651049:web:42cb423f3c0911fe5709f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let bancoPatrimonio = [];
    let html5QrcodeScanner = null;
    let cameraAtiva = false;
    let itemAtualSelecionado = null;

    // CARREGA E ESCUTA BANCO DE DADOS EM TEMPO REAL
    onSnapshot(collection(db, "patrimonios"), (snapshot) => {
      bancoPatrimonio = [];
      snapshot.forEach(docSnap => {
        bancoPatrimonio.push({ id: docSnap.id, ...docSnap.data() });
      });
      popularSelectsDivisao();
      renderizarRelaçãoBD();
    });

    function limparPlaqueta(str) {
      if (!str) return '';
      return String(str).replace(/\D/g, '');
    }

    function popularSelectsDivisao() {
      const selectLocalizacao = document.getElementById('select-localizacao');
      const selectFiltro = document.getElementById('filtro-divisao');

      if (bancoPatrimonio.length > 0) {
        const divSet = [...new Set(bancoPatrimonio.map(i => i.divisao))].sort();

        // Popula Select da Aba 1 se estiver vazio
        if (selectLocalizacao.options.length <= 1) {
          divSet.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d; opt.innerText = d;
            selectLocalizacao.appendChild(opt);
          });
        }

        // Popula Select da Aba 2 se estiver vazio
        if (selectFiltro.options.length <= 1) {
          divSet.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d; opt.innerText = d;
            selectFiltro.appendChild(opt);
          });
        }
      }
    }

    function preencherEConsultarPlaqueta(codigoLido) {
      const codLimpo = limparPlaqueta(codigoLido);
      const input = document.getElementById('input-plaqueta');
      input.value = codLimpo;
      if (navigator.vibrate) navigator.vibrate(100);
      buscarEExibirItem(codLimpo);
    }

    // AUTOCOMPLETAR AO DIGITAR
    const inputPlaqueta = document.getElementById('input-plaqueta');
    const suggestionsBox = document.getElementById('suggestions-box');

    inputPlaqueta.addEventListener('input', (e) => {
      const valor = limparPlaqueta(e.target.value);
      if (!valor || bancoPatrimonio.length === 0) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      const correspondencias = bancoPatrimonio
        .filter(i => i.plaqueta.includes(valor))
        .slice(0, 5);

      if (correspondencias.length > 0) {
        suggestionsBox.innerHTML = correspondencias.map(i => `
          <div class="p-2 hover:bg-slate-700 cursor-pointer text-xs border-b border-slate-700/50 flex justify-between" data-plaqueta="${i.plaqueta}">
            <span class="font-bold text-blue-400">${i.plaqueta}</span>
            <span class="text-slate-400 truncate max-w-[180px]">${i.descricao}</span>
          </div>
        `).join('');
        suggestionsBox.classList.remove('hidden');
      } else {
        suggestionsBox.classList.add('hidden');
      }
    });

    suggestionsBox.addEventListener('click', (e) => {
      const item = e.target.closest('[data-plaqueta]');
      if (item) {
        const plaqueta = item.getAttribute('data-plaqueta');
        preencherEConsultarPlaqueta(plaqueta);
        suggestionsBox.classList.add('hidden');
      }
    });

    // CÂMERA E LEITOR
    document.getElementById('btn-toggle-cam').addEventListener('click', () => {
      if (cameraAtiva) {
        if (html5QrcodeScanner) html5QrcodeScanner.stop();
        cameraAtiva = false;
        document.getElementById('reader').innerText = "Câmera pausada";
        document.getElementById('btn-toggle-cam').innerText = "Ligar Câmera";
        document.getElementById('btn-capturar-frame').classList.add('hidden');
      } else {
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 15, qrbox: { width: 260, height: 130 } },
          (decodedText) => {
            preencherEConsultarPlaqueta(decodedText);
          }
        ).then(() => {
          cameraAtiva = true;
          document.getElementById('btn-toggle-cam').innerText = "Desligar Câmera";
          document.getElementById('btn-capturar-frame').classList.remove('hidden');
        }).catch(() => alert("Permissão de câmera negada ou indisponível."));
      }
    });

    document.getElementById('btn-capturar-frame').addEventListener('click', () => {
      if (!cameraAtiva) return;
      html5QrcodeScanner.scanFile()
        .then(decodedText => preencherEConsultarPlaqueta(decodedText))
        .catch(() => alert("Aproxime mais a câmera para ler a etiqueta claramente."));
    });

    // BUSCAR ITEM
    document.getElementById('btn-buscar').addEventListener('click', () => {
      const cod = limparPlaqueta(inputPlaqueta.value);
      buscarEExibirItem(cod);
    });

    async function buscarEExibirItem(plaquetaCod) {
      if (!plaquetaCod) return;

      const itemLocal = bancoPatrimonio.find(i => i.plaqueta === plaquetaCod);

      if (itemLocal) {
        itemAtualSelecionado = itemLocal;
        exibirDetalhes(itemLocal);
      } else {
        const docRef = doc(db, "patrimonios", plaquetaCod);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          itemAtualSelecionado = { id: docSnap.id, ...docSnap.data() };
          exibirDetalhes(itemAtualSelecionado);
        } else {
          document.getElementById('item-details').classList.add('hidden');
          alert(`Plaqueta ${plaquetaCod} não encontrada no banco de dados.`);
        }
      }
    }

    function exibirDetalhes(item) {
      document.getElementById('item-details').classList.remove('hidden');
      document.getElementById('det-plaqueta').innerText = `Plaqueta: ${item.plaqueta}`;
      document.getElementById('det-descricao').innerText = item.descricao;
      document.getElementById('det-divisao').innerText = item.divisao;

      const badgeStatus = document.getElementById('det-status');
      if (item.localizado) {
        badgeStatus.innerText = "🟢 LOCALIZADO";
        badgeStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-900 text-emerald-300 border border-emerald-500/30";
      } else {
        badgeStatus.innerText = "🔴 PENDENTE";
        badgeStatus.className = "px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-amber-900 text-amber-300 border border-amber-500/30";
      }

      // Preenche automaticamente a localização atual se já foi localizada ou com a divisão original
      const selectLoc = document.getElementById('select-localizacao');
      selectLoc.value = item.localizacaoAtual || item.divisao || '';
      document.getElementById('input-observacao').value = item.observacaoAtual || '';
    }

    // REGISTRO NO FIRESTORE
    document.getElementById('btn-salvar').addEventListener('click', async () => {
      if (!itemAtualSelecionado) return alert("Selecione um patrimônio válido primeiro.");
      const loc = document.getElementById('select-localizacao').value;
      if (!loc) return alert("Selecione a Localização/Divisão Atual do bem.");

      const docRef = doc(db, "patrimonios", itemAtualSelecionado.plaqueta);
      await updateDoc(docRef, {
        localizado: true,
        localizacaoAtual: loc,
        observacaoAtual: document.getElementById('input-observacao').value.trim(),
        dataLocalizacao: new Date().toLocaleString('pt-BR')
      });

      alert(`Patrimônio ${itemAtualSelecionado.plaqueta} marcado como LOCALIZADO!`);
      inputPlaqueta.value = '';
      document.getElementById('select-localizacao').value = '';
      document.getElementById('input-observacao').value = '';
      document.getElementById('item-details').classList.add('hidden');
      itemAtualSelecionado = null;
    });

    // ABAS
    document.getElementById('tab-btn-scanner').addEventListener('click', () => alternarAba('scanner'));
    document.getElementById('tab-btn-lista').addEventListener('click', () => alternarAba('lista'));

    function alternarAba(aba) {
      document.getElementById('sec-scanner').classList.toggle('hidden', aba !== 'scanner');
      document.getElementById('sec-lista').classList.toggle('hidden', aba !== 'lista');
      document.getElementById('tab-btn-scanner').className = aba === 'scanner' ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-700 text-slate-300';
      document.getElementById('tab-btn-lista').className = aba === 'lista' ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white' : 'px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-700 text-slate-300';
    }

    // RENDERIZAR PAINEL SEGUNDA ABA
    function renderizarRelaçãoBD() {
      const container = document.getElementById('container-accordions');
      const termo = document.getElementById('filtro-busca').value.toLowerCase();
      const statusFiltro = document.getElementById('filtro-status').value;
      const divisaoFiltro = document.getElementById('filtro-divisao').value;

      const total = bancoPatrimonio.length;
      const localizados = bancoPatrimonio.filter(i => i.localizado).length;
      document.getElementById('cnt-total').innerText = total;
      document.getElementById('cnt-localizados').innerText = localizados;
      document.getElementById('cnt-pendentes').innerText = total - localizados;

      const itensFiltrados = bancoPatrimonio.filter(i => {
        const matchTermo = i.plaqueta.includes(termo) || i.descricao.toLowerCase().includes(termo);
        const matchStatus = statusFiltro === 'todos' || (statusFiltro === 'localizados' ? i.localizado : !i.localizado);
        const matchDivisao = divisaoFiltro === 'todas' || i.divisao === divisaoFiltro;
        return matchTermo && matchStatus && matchDivisao;
      });

      const grupos = {};
      itensFiltrados.forEach(i => {
        if (!grupos[i.divisao]) grupos[i.divisao] = [];
        grupos[i.divisao].push(i);
      });

      container.innerHTML = '';
      Object.keys(grupos).sort().forEach((divNome, idx) => {
        const itensDaDiv = grupos[divNome];
        const locCount = itensDaDiv.filter(i => i.localizado).length;

        const accordion = document.createElement('div');
        accordion.className = "bg-slate-800 rounded-xl border border-slate-700 overflow-hidden";
        accordion.innerHTML = `
          <button onclick="document.getElementById('acc-${idx}').classList.toggle('collapsed')" class="w-full flex justify-between items-center p-3 text-left font-bold text-xs bg-slate-800 border-b border-slate-700/50">
            <span class="text-blue-400 font-semibold">📁 ${divNome} (${itensDaDiv.length})</span>
            <span class="text-[10px] ${locCount === itensDaDiv.length ? 'text-emerald-400' : 'text-amber-400'}">${locCount}/${itensDaDiv.length} Localizados</span>
          </button>
          <div id="acc-${idx}" class="accordion-content collapsed p-2 space-y-2 bg-slate-900/50">
            ${itensDaDiv.map(item => `
              <div class="bg-slate-800/90 p-2.5 rounded-lg border ${item.localizado ? 'border-emerald-500/40' : 'border-slate-700'} text-xs space-y-1">
                <div class="flex justify-between items-center">
                  <span class="font-bold text-white">Plaqueta: ${item.plaqueta}</span>
                  <span class="px-1.5 py-0.5 rounded text-[9px] font-bold ${item.localizado ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-700 text-slate-400'}">
                    ${item.localizado ? '🟢 LOCALIZADO' : '🔴 PENDENTE'}
                  </span>
                </div>
                <p class="text-slate-300 text-[11px]">${item.descricao}</p>${item.localizado ? `
                  <div class="mt-1 pt-1 border-t border-slate-700/50 text-[10px] text-emerald-400">
                    <div>📍 <strong>Local Atual:</strong> ${item.localizacaoAtual}</div>
                    ${item.observacaoAtual ? `<div>📝 <strong>Obs:</strong> ${item.observacaoAtual}</div>` : ''}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(accordion);
      });
    }

    document.getElementById('filtro-busca').addEventListener('input', renderizarRelaçãoBD);
    document.getElementById('filtro-status').addEventListener('change', renderizarRelaçãoBD);
    document.getElementById('filtro-divisao').addEventListener('change', renderizarRelaçãoBD);
  </script>
</body>
</html>
